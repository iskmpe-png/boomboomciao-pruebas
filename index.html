<meta name="mobile-web-app-capable" content="yes">

<body>

<div class="wrap">
  <header class="top">
    <button class="btn small" id="btn-menu" type="button" aria-controls="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menú</button>
    <h1><img src="img/logo-oro.png" alt="Boom Boom Ciao" width="92" height="39"></h1>
    <span class="voz"><span class="voz-t">Gestión de cocina</span><small id="rol"></small></span>
    <button class="btn small" id="btn-buscar" type="button" aria-label="Buscar en toda la app" title="Buscar (Ctrl + K)"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  </header>
  <div class="subs" id="subs" hidden></div>
  <p class="aviso" id="aviso" hidden></p>
  <main id="vista" class="col"><section class="card estado"><strong>Cargando la cocina</strong><span>Platos, precios, inventario y mermas.</span></section></main>
  <p class="hint" id="guardado" aria-live="polite"></p>
  <datalist id="dl-productos"></datalist>
  <datalist id="dl-solo-prod"></datalist>
  <datalist id="dl-proveedores"></datalist>
  <datalist id="dl-grupos"></datalist>
</div>
<button class="btn" id="btn-deshacer" type="button" hidden></button>
<div id="velo"></div>
<aside id="menu" aria-label="Menú principal">
  <div class="m-top"><img src="img/logo-oro.png" alt="" width="110" height="46"><button class="icon" id="menu-cerrar" type="button" aria-label="Cerrar menú">×</button></div>
  <nav id="menu-nav" aria-label="Secciones"></nav>
  <div class="m-cuenta" id="m-cuenta" hidden><div class="fila"><b id="cu-nombre"></b><span class="m-bts"><button class="btn small" id="btn-usuarios" type="button" hidden>Usuarios</button><button class="btn small" id="btn-salir" type="button">Salir</button></span></div><select id="cu-rest" aria-label="Restaurante" hidden></select><div class="m-enl"><button class="link" id="btn-clave" type="button">Cambiar contraseña</button><button class="link" id="btn-copias" type="button" hidden>Copias automáticas</button><button class="link" id="btn-legal" type="button">Aviso legal</button></div></div>
  <div class="m-pie" id="m-des" hidden><span class="lbl">Último cambio</span><button class="btn small" id="btn-des-menu" type="button">Deshacer</button></div>
  <div class="m-pie" id="m-copia" hidden><span class="lbl">Copia de datos</span><span class="m-bts"><button class="btn small" id="btn-copia" type="button">Descargar</button><button class="btn small" id="btn-restaurar" type="button" hidden>Restaurar</button></span><input id="f-copia" type="file" accept=".json,application/json" hidden></div>
  <div class="m-pie"><span class="lbl">Apariencia</span><button class="btn small" id="btn-tema" type="button">Oscuro</button></div>
</aside>
<div id="toast" role="status" hidden></div>
<div id="cocina" hidden></div>
<div id="capa" hidden role="dialog" aria-modal="true" aria-label="Información"></div>
<div id="entorno" hidden>ENTORNO DE PRUEBAS</div>
<div id="usuarios" hidden role="dialog" aria-modal="true" aria-label="Usuarios"></div>
<div id="acceso" hidden></div>
<div id="multi" hidden role="dialog" aria-modal="true" aria-label="Exportar varios"></div>
