<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boom Boom Ciao</title>
<meta name="description" content="Gestión de cocina: escandallos, precios, recetas, inventario y mermas.">
<meta name="theme-color" content="#2D3661">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boom Boom Ciao">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<script src="config.js"></script>
<script src="supabase.js"></script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<style>
/* Layout: cabecera azul con botón de menú; menú lateral desplegable (cajón en móvil, fijo en escritorio) con las secciones y sus apartados. Cada pantalla: barra fija con buscador y acciones, y debajo listas compactas paginadas. */
:root{
  --bg:#F3ECDD; --surface:#FCF9F2; --sunken:#ECE4D1;
  --ink:#121512; --muted:#5E5C52; --line:#D9CFB8;
  --accent:#2D3661; --accent-soft:#DDDEE7; --on-accent:#F3ECDD;
  --oro:#C8A24A; --band:#2D3661; --band-ink:#F3ECDD; --band-oro:#E3C36A; --band-line:#4A5387;
  --ok:#1F6B3A; --ok-bg:#DCEBD7;
  --warn:#7D4E00; --warn-bg:#F5E4BC;
  --crit:#A3261E; --crit-bg:#F3D9D2;
  --font-display:"Anton",Impact,"Arial Narrow",sans-serif;
  --font-voz:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14172B; --surface:#1F2442; --sunken:#181C35;
    --ink:#F3ECDD; --muted:#B7B3A6; --line:#3A426C;
    --accent:#E3C36A; --accent-soft:#3A3B50; --on-accent:#121512;
    --oro:#C8A24A; --band:#2D3661; --band-ink:#F3ECDD; --band-oro:#E3C36A; --band-line:#4A5387;
    --ok:#7FD39A; --ok-bg:#18372A;
    --warn:#F0BC66; --warn-bg:#3D3015;
    --crit:#F39389; --crit-bg:#43201E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14172B; --surface:#1F2442; --sunken:#181C35;
  --ink:#F3ECDD; --muted:#B7B3A6; --line:#3A426C;
  --accent:#E3C36A; --accent-soft:#3A3B50; --on-accent:#121512;
  --oro:#C8A24A; --band:#2D3661; --band-ink:#F3ECDD; --band-oro:#E3C36A; --band-line:#4A5387;
  --ok:#7FD39A; --ok-bg:#18372A;
  --warn:#F0BC66; --warn-bg:#3D3015;
  --crit:#F39389; --crit-bg:#43201E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--font-display);font-weight:400;font-size:1.3rem;line-height:1;text-transform:uppercase;color:var(--band-oro)}
h1 img{display:block;width:92px;height:auto}
h2{font-family:var(--font-voz);font-weight:400;font-size:1.45rem;line-height:1.1;text-wrap:balance}
h3,.lbl,.field>label,.mini>span{font-family:var(--font-mono);font-weight:500;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;gap:12px;align-items:center;background:var(--band);color:var(--band-ink);border-radius:14px;padding:10px 14px;border-bottom:3px solid var(--oro)}
.voz{flex:1;min-width:0;font-family:var(--font-voz);font-style:italic;font-size:1.3rem;line-height:1.05}
.top .btn{background:transparent;border-color:var(--band-line);color:var(--band-ink)}
.hint{font-size:.82rem;color:var(--muted)}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
input,select{height:42px;padding:0 10px}
textarea{padding:10px;line-height:1.5;resize:vertical}
input:disabled,select:disabled{background:var(--sunken);color:var(--muted);opacity:1}
input.num{font-variant-numeric:tabular-nums;text-align:right}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top :focus-visible{outline-color:var(--band-oro)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.grow{flex:1 1 160px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--crit)}
.btn.small{height:36px;padding:0 12px;font-size:.84rem}
.icon{flex:none;cursor:pointer;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.15rem;line-height:1;color:var(--muted)}
.link{cursor:pointer;border:0;background:transparent;padding:0;color:var(--accent);font-weight:600;font-size:.84rem;text-decoration:underline}
.aviso{background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.estado{padding:32px 16px;text-align:center;color:var(--muted);align-items:center}
.estado strong{color:var(--ink);font-family:var(--font-voz);font-weight:400;font-size:1.5rem;line-height:1.1}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.acciones{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* Barra fija de cada sección */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.bar .field{flex:1 1 140px}
.bar .corto{flex:0 1 170px}
/* Cifras y estados */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--font-display);font-weight:400;font-size:1.55rem;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.chip{display:inline-flex;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);font-size:.64rem;letter-spacing:.05em;text-transform:uppercase;font-weight:500}
/* Listas compactas */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:9px 2px;border-top:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;color:inherit}
.rows>.row:first-child{border-top:0}
button.row{cursor:pointer}
.row .n{display:flex;flex-direction:column;min-width:0}
.row .n b{font-weight:600;overflow-wrap:anywhere}
.row .n span{font-size:.8rem;color:var(--muted)}
.row .d{display:flex;gap:10px;align-items:center;justify-content:flex-end;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .d b{font-weight:600}
.mas{align-self:center;margin-top:8px}
.editor{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:end;padding:12px;background:var(--sunken);border-radius:12px;margin:6px 0}
.editor .wide{grid-column:1/-1}
.precio{display:flex;gap:6px}
.precio select{width:84px;flex:none;padding:0 6px}
/* Ficha de plato */
.resumen{flex:1 1 220px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;min-width:0}
.resumen .g{font-family:var(--font-display);font-weight:400;font-size:1.7rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.resumen span{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.resumen .pill.ok{color:var(--ok)}.resumen .pill.warn{color:var(--warn)}.resumen .pill.crit{color:var(--crit)}
.ficha{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.wide{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:center;font-size:.88rem}
.check input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.ing{display:grid;gap:6px 8px;padding:8px 0;border-top:1px solid var(--line);grid-template-columns:repeat(4,minmax(0,1fr));align-items:end}
.ing .i-n{grid-column:1/-1;display:flex;gap:6px}
.ing .i-p.libre{grid-column:1/-1;order:5}
.ing .i-x{order:6}
.ing .i-x{grid-column:1/-1;font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ing .i-x:empty{display:none}
.mini{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini output,.mini b{height:42px;display:flex;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.92rem}
.mini b{justify-content:flex-end;font-weight:700}
.ing-head{display:none}
details{border-top:1px solid var(--line);padding-top:10px}
details>summary{cursor:pointer;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:500}
details[open]>summary{margin-bottom:10px}
.barras{display:flex;flex-direction:column;gap:8px}
.fila-barra{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.86rem}
.fila-barra .v{font-variant-numeric:tabular-nums;color:var(--muted)}
.fila-barra .pista{grid-column:1/-1;height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.fila-barra .pista i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ri{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:28px}
.ri li{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-top:1px solid var(--line)}
.ri li b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--sunken);padding:4px;border-radius:12px}
.seg button{cursor:pointer;height:34px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.invrow{grid-template-columns:minmax(0,1fr) 128px}
.invrow .q{display:flex;gap:6px;align-items:center}
.invrow .q span{font-size:.82rem;color:var(--muted);width:20px;flex:none}
.invrow .v{grid-column:1/-1;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.invrow .v:empty{display:none}
.msg{font-size:.86rem;padding:8px 10px;border-radius:10px;background:var(--sunken)}
.exp{position:relative;margin-left:auto}
.exp-m{position:absolute;right:0;top:calc(100% + 6px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:170px}
.exp-m button{cursor:pointer;height:40px;border:0;background:transparent;border-radius:8px;text-align:left;padding:0 10px;font-weight:600;font-size:.9rem}
.exp-m button:hover{background:var(--sunken)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;max-width:calc(100% - 32px)}
@media (min-width:620px){
  .ficha{grid-template-columns:repeat(4,minmax(0,1fr))}
  .editor{grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1.1fr) auto}
  .editor.m6{grid-template-columns:repeat(4,minmax(0,1fr))}
  .editor .wide{grid-column:auto}
  .editor.m6 .wide{grid-column:span 2}
  .ing{grid-template-columns:minmax(0,2.2fr) 92px 78px minmax(0,1.25fr) 84px;align-items:center}
  .ing .i-n,.ing .i-p,.ing .i-p.libre{grid-column:auto;order:0}
  .ing .i-x{order:0}
  .ing .mini>span{display:none}
  .ing-head{display:grid;gap:8px;grid-template-columns:minmax(0,2.2fr) 92px 78px minmax(0,1.25fr) 84px;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
  .ing-head span:nth-child(n+2){text-align:right}
  .ri{grid-template-columns:repeat(2,minmax(0,1fr))}
  .invrow{grid-template-columns:minmax(0,1fr) 140px 100px}
  .invrow .v{grid-column:auto}
  .invrow .v:empty{display:block}
}
@media (min-width:860px){
  .wrap{padding-block:16px 40px}
  .dos{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px;align-items:start}
}
.subs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.subs a{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:600;white-space:nowrap}
.subs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.togs{display:flex;flex-wrap:wrap;gap:6px}
.tog{cursor:pointer;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:600;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.full{grid-column:1/-1}
.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
a.row{color:inherit}
.lab{background:#FFFFFF;color:#121512;border:2px solid #121512;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.lab>*{margin:0 14px}
.lab .lbl{color:#5E5C52}
.lab-top{margin:0;background:#2D3661;color:#E3C36A;font-family:var(--font-display);font-size:1.2rem;padding:8px 14px;letter-spacing:.02em}
.lab-n{font-family:var(--font-voz);font-size:2rem;line-height:1.05}
.lab-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lab-f div{display:flex;flex-direction:column}
.lab-f b{font-family:var(--font-display);font-weight:400;font-size:1.9rem;line-height:1.1}
.lab-f div:last-child b{color:#A3261E}
#cocina{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:16px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#multi,#usuarios,#acceso,#capa{position:fixed;inset:0;z-index:21;background:var(--bg);display:flex;flex-direction:column;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#multi>*,#usuarios>*,#capa>*{width:100%;max-width:820px;margin-inline:auto}
.mx-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mx-top h2{font-size:1.7rem}
.mx-fil{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.mx-fil .field{flex:1 1 140px}
.mx-lista{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 12px}
.mx-it{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.mx-it:first-child{border-top:0}
.mx-it input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.mx-it span{display:flex;flex-direction:column;min-width:0}
.mx-it b{font-weight:600;overflow-wrap:anywhere}
.mx-it small{font-size:.8rem;color:var(--muted)}
.mx-pie{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mx-pie .btn{flex:1 1 110px}
.mx-pie .btn:disabled{opacity:.5;cursor:default}
#acceso{z-index:40;overflow-y:auto;align-items:center}
.ac-caja{width:100%;max-width:400px;margin:auto;display:flex;flex-direction:column;gap:14px}
.ac-caja h2{font-size:2rem}
.ac-logo{background:var(--band);border-radius:14px;border-bottom:3px solid var(--oro);padding:18px;display:flex;justify-content:center}
.ac-caja .link{align-self:flex-start}
.us-it{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.us-it:first-child{border-top:0}
.us-n{flex:1 1 180px;display:flex;flex-direction:column;min-width:0}
.us-n b{font-weight:600;overflow-wrap:anywhere}
.us-n small{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.us-it select{width:auto;flex:0 1 160px}
.m-cuenta{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--band-line);padding-top:12px}
.m-cuenta .fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
.m-cuenta b{font-weight:600;overflow-wrap:anywhere}
.m-cuenta select{color:var(--ink)}
.m-cuenta .btn{background:transparent;border-color:var(--band-line);color:var(--band-ink)}
#btn-deshacer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:8;max-width:calc(100% - 32px);background:var(--band);color:var(--band-ink);border-color:var(--oro);box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-add{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;align-items:flex-end}
.pv-lista{display:flex;flex-direction:column}
.pv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.5fr);gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.pv:first-child{border-top:0;padding-top:0}
.pv-n{display:flex;flex-direction:column;min-width:0;align-self:center}
.pv-n b{font-weight:600;overflow-wrap:anywhere}
.pv-n small,.hi-c small{font-size:.8rem;color:var(--muted)}
@media (max-width:760px){.pv{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pv-n,.pv .field:last-child{grid-column:1/-1}}
.ped-d{display:flex;align-items:center;gap:8px}
.ped-d input{width:84px}
.hi-lista{display:flex;flex-direction:column}
.hi{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.hi:first-child{border-top:0;padding-top:0}
.hi-c{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.hi-t{overflow-wrap:anywhere}
.hi-d{margin:0;padding-left:18px;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.hi-d li{overflow-wrap:anywhere}
#capa{z-index:45}
.legal{padding:14px 16px}
.legal h3{font-size:1rem;margin:14px 0 4px}

<script>
(function(){
  const $ = id => document.getElementById(id);
  const q = (el,s) => el.querySelector(s);
  const fEur = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
  const fNum = (v,d) => new Intl.NumberFormat('es-ES',{maximumFractionDigits:d==null?1:d}).format(v);
  const parse = s => { const n = parseFloat(String(s).replace(/\s/g,'').replace(',','.')); return isFinite(n) ? n : 0; };
  const show = n => n ? String(n).replace('.',',') : '';
  const r3 = n => Math.round((Number(n)||0)*1000)/1000;
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  const uni = u => u==='l'||u==='ud' ? u : 'kg';
  const pad = n => String(n).padStart(2,'0');
  const hoy = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
  const fFecha = s => { const d = s && s.length<=10 ? new Date(s+'T12:00:00') : new Date(s); return isNaN(d) ? '' : d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}); };
  const fMes = m => { const d=new Date(m+'-15T12:00:00'); const t=d.toLocaleDateString('es-ES',{month:'long',year:'numeric'}); return t.charAt(0).toUpperCase()+t.slice(1); };
  const UD={kg:'g',l:'ml',ud:'ud'}, UDP={kg:'€/kg',l:'€/L',ud:'€/ud'}, UDI={kg:'kg',l:'L',ud:'ud'};
  const SUBS={inicio:[['panel','Panel'],['asistente','Asistente']],carta:[['platos','Platos'],['sala','Sala y alérgenos'],['ingenieria','Ingeniería'],['eventos','Eventos']],precios:[['productos','Productos'],['comparar','Comparar'],['alertas','Alertas']],
    cocina:[['recetas','Recetas'],['produccion','Producción'],['etiquetas','Etiquetas'],['appcc','APPCC']],almacen:[['inventario','Inventario'],['pedidos','Pedidos'],['compras','Compras'],['proveedores','Proveedores'],['mermas','Mermas']]};
  const sub={inicio:'panel',carta:'platos',precios:'productos',cocina:'recetas',almacen:'inventario'};
  const LEG={'carta/platos':'carta','precios/productos':'precios','cocina/recetas':'recetas','almacen/inventario':'inventario','almacen/mermas':'mermas'};
  const ALIAS={escandallos:'carta',proveedores:'precios',recetas:'cocina-recetas',inventario:'almacen-inventario',mermas:'almacen-mermas'};
  const PER={diario:'Diario',quincenal:'Quincenal',mensual:'Mensual'};
  const MOTIVOS=['Caducado','Mal estado','Error de cocina','Devolución de sala','Rotura o caída','Otro'];
  const G_BASE='Elaboraciones de la casa';

  const S={platos:[],productos:[],inventarios:[],mermas:[],compras:[],appcc:[],ventas:[],planes:[],eventos:[],proveedores:[],ajustes:{id:'empresa',nombre:'Boom Boom Ciao',periodo:'mensual'}};
  const COLS=['platos','productos','inventarios','mermas','compras','appcc','ventas','planes','eventos','proveedores'];
  const cargado={};
  let vista='inicio', pant='panel', platoId=null, abierta=false, recetaId=null, db=null, soloLectura=false, conCostes=false;
  const fil={carta:'',precios:'',inv:'',sala:''}, lim={carta:20,precios:25,inv:20,mermas:25,sala:20,appcc:25,compras:25,hist:30};
  let grp='', prov='', editProd=null, addProd=false, invSub='conteo', mesM=hoy().slice(0,7);
  const pend={};

  const aviso = t => { const a=$('aviso'); a.textContent=t||''; a.hidden=!t; };
  const estado = t => { $('guardado').textContent=t; };
  const PFX=(window.BBC_SUPABASE&&window.BBC_SUPABASE.entorno==='pruebas')?'pru.':'';
  function mem(k,v){ k=PFX+k; try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){} return null; }
  let tt; function toast(t){ const el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>{ el.hidden=true; },3500); }

  /* ---- Normalizadores ---- */
  const nPlato = p => ({ id:p.id, nombre:String(p.nombre||''), raciones:Number(p.raciones)||1, objetivo:Number(p.objetivo)||30,
    iva:(p.iva==null?10:Number(p.iva)||0), pvp:Number(p.pvp)||0, elaboracion:String(p.elaboracion||''),
    base:!!p.base, unidadBase:uni(p.unidadBase), grupo:String(p.grupo||''), descripcion:String(p.descripcion||''), vino:String(p.vino||''),
    alergenos:Array.isArray(p.alergenos)?p.alergenos.map(String):[], caducidad:Number(p.caducidad)||0,
    ingredientes:(Array.isArray(p.ingredientes)?p.ingredientes:[]).map(i => ({ nombre:String(i.nombre||''), productoId:String(i.productoId||''), baseId:String(i.baseId||''),
      precio:Number(i.precio)||0, unidad:uni(i.unidad), cantidad:Number(i.cantidad)||0, merma:Number(i.merma)||0 })) });
  const nProd = p => ({ id:p.id, nombre:String(p.nombre||''), proveedor:String(p.proveedor||''), precio:Number(p.precio)||0, unidad:uni(p.unidad), actualizado:String(p.actualizado||''),
    alergenos:Array.isArray(p.alergenos)?p.alergenos.map(String):[], minimo:Number(p.minimo)||0, familia:String(p.familia||''), anterior:Number(p.anterior)||0,
    historial:(Array.isArray(p.historial)?p.historial:[]).slice(-12).map(h => ({f:String(h.f||''),p:Number(h.p)||0})) });
  const nInv = v => ({ id:v.id, fecha:String(v.fecha||hoy()), periodo:PER[v.periodo]?v.periodo:'mensual', cerrado:!!v.cerrado,
    cantidades:(v.cantidades&&typeof v.cantidades==='object')?v.cantidades:{}, lineas:Array.isArray(v.lineas)?v.lineas:[], total:Number(v.total)||0, por:String(v.por||'') });
  const nMerma = m => ({ id:m.id, fecha:String(m.fecha||hoy()), nombre:String(m.nombre||''), productoId:String(m.productoId||''), proveedor:String(m.proveedor||''),
    cantidad:Number(m.cantidad)||0, unidad:uni(m.unidad), precio:Number(m.precio)||0, motivo:String(m.motivo||'Otro'), creado:String(m.creado||''), por:String(m.por||'') });
  const mapa = o => (o&&typeof o==='object'&&!Array.isArray(o)) ? o : {};
  const nCompra = c => ({ id:c.id, fecha:String(c.fecha||hoy()), proveedor:String(c.proveedor||''), albaran:String(c.albaran||''), importe:Number(c.importe)||0, creado:String(c.creado||''), por:String(c.por||''),
    lineas:(Array.isArray(c.lineas)?c.lineas:[]).map(l => ({nombre:String(l.nombre||''),productoId:String(l.productoId||''),cantidad:Number(l.cantidad)||0,unidad:uni(l.unidad),precio:Number(l.precio)||0})) });
  const nAppcc = a => ({ id:a.id, fecha:String(a.fecha||hoy()), hora:String(a.hora||''), tipo:['temp','limpieza','recepcion'].indexOf(a.tipo)>=0?a.tipo:'temp', punto:String(a.punto||''),
    valor:(a.valor===''||a.valor==null)?null:Number(a.valor), ok:a.ok!==false, nota:String(a.nota||''), quien:String(a.quien||''), por:String(a.por||'') });
  const nVenta = v => ({ id:v.id, unidades:mapa(v.unidades), semanas:mapa(v.semanas), importes:Array.isArray(v.importes)?v.importes:[] });
  const nPlan = v => ({ id:v.id, items:mapa(v.items), hecho:mapa(v.hecho) });
  const nEvento = e => ({ id:e.id, nombre:String(e.nombre||''), pax:Number(e.pax)||0, precio:Number(e.precio)||0, platos:(Array.isArray(e.platos)?e.platos:[]).map(x => ({id:String(x.id||''),n:Number(x.n)||0})) });
  const nProv = p => ({ id:p.id, nombre:String(p.nombre||''), whatsapp:String(p.whatsapp||''), email:String(p.email||''), nota:String(p.nota||'') });
  const NORM={proveedores:nProv,platos:nPlato,productos:nProd,inventarios:nInv,mermas:nMerma,compras:nCompra,appcc:nAppcc,ventas:nVenta,planes:nPlan,eventos:nEvento};

  /* ---- Índices: búsquedas por id y por nombre sin recorrer las listas ---- */
  let ix=null, dlSucio=true;
  function idx(){
    if(!ix){ ix={p:new Map(),pn:new Map(),pk:new Map(),pl:new Map(),bn:new Map(),fam:new Map()};
      S.productos.forEach(p => { ix.p.set(p.id,p); ix.pn.set(norm(p.nombre),p); ix.pk.set(p.id,norm(p.nombre+' '+p.proveedor)); const f=famDe(p); if(!ix.fam.has(f)) ix.fam.set(f,[]); ix.fam.get(f).push(p); });
      S.platos.forEach(p => { ix.pl.set(p.id,p); if(p.base) ix.bn.set(norm(p.nombre),p); }); }
    return ix;
  }
  function sucio(){ ix=null; dlSucio=true; }

  /* ---- Guardado: una escritura a la vez por documento ---- */
  const busy = (col,id) => { const p=pend[col+'/'+id]; return !!(p&&(p.dirty||p.saving)); };
  const persistLocal = () => mem('esc2.datos', JSON.stringify(S));
  const ref = (col,id) => col==='ajustes' ? db.doc('ajustes/empresa') : db.collection(col).doc(id);
  const limpio = o => { const c=JSON.parse(JSON.stringify(o)); delete c.id; return c; };
  function guardar(col,obj,ya){
    if(COLNIV[col]!=null&&!puede(COLNIV[col])){ estado('Tu usuario no puede guardar este cambio.'); return; }
    if(col==='platos'||col==='productos') sucio();
    if(col!=='ajustes') anotar(col,obj);
    const key=col+'/'+obj.id, p=pend[key]||(pend[key]={}); p.obj=obj; p.col=col; p.dirty=true;
    if(soloLectura){ estado('Cambios sin guardar: solo lectura'); return; }
    estado('Guardando…'); clearTimeout(p.timer); p.timer=setTimeout(() => volcar(key), ya?0:700);
  }
  function volcar(key){
    const p=pend[key]; if(!p||!p.dirty) return; if(p.saving){ p.again=true; return; }
    p.saving=true; p.dirty=false; let t;
    try{ if(db) t=ref(p.col,p.obj.id).set(limpio(p.obj)); else { persistLocal(); t=Promise.resolve(); } }catch(e){ t=Promise.reject(e); }
    t.then(() => estado(db?(db.pend&&db.pend()?'Guardado en este dispositivo. Se subirá al volver la conexión.':'Cambios guardados'):'Guardado solo en este navegador'), e => {
      if(e&&e.code==='invalid_argument'){ soloLectura=true; aviso('Puedes consultar y calcular, pero no tienes permiso para guardar cambios en esta página.'); estado('Solo lectura'); }
      else { p.dirty=true; estado('No se pudo guardar. Se reintentará con tu próximo cambio.'); }
    }).then(() => { p.saving=false; if(p.again){ p.again=false; volcar(key); } });
  }
  function borrar(col,id){
    if(!puede(2)&&!deshaciendo){ toast('Solo el encargado puede eliminar.'); return; }
    anotarBaja(col,id);
    const p=pend[col+'/'+id]; if(p){ clearTimeout(p.timer); p.dirty=false; }
    S[col]=S[col].filter(x => x.id!==id); sucio();
    if(db) ref(col,id).delete().catch(() => aviso('No se pudo eliminar. Inténtalo de nuevo.')); else persistLocal();
  }
  const nuevoId = col => db ? db.collection(col).doc().id : 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  /* ---- Datos y cálculo ---- */
  const prod = id => id ? idx().p.get(id)||null : null;
  const prodPorNombre = n => { n=norm(n); return n ? idx().pn.get(n)||null : null; };

  const RU='(kilogramos?|kilos?|kgs?|gramos?|grs?|g|mililitros?|ml|litros?|lts?|l|unidades|unidad|uds?)';
  const claseU = u => { if(!u) return ''; if(/^(kilo|kg)/.test(u)) return 'kg'; if(/^(gr|g$)/.test(u)) return 'g'; if(/^(mili|ml)/.test(u)) return 'ml'; if(/^(li|lt|l$)/.test(u)) return 'l'; return 'ud'; };
  function buscarProd(n){
    if(!n) return null; const ex=prodPorNombre(n); if(ex) return ex;
    const tk=n.split(' '); let mejor=null, pm=0;
    idx().pn.forEach((p,pn) => { let s=0;
      if(pn.indexOf(n)>=0||n.indexOf(pn)>=0) s=0.9-Math.abs(pn.length-n.length)/200; else { const pt=pn.split(' '), c=tk.filter(x => x.length>2&&pt.indexOf(x)>=0).length; s=c/Math.max(tk.length,1); }
      if(s>pm){ pm=s; mejor=p; } });

  }
  function leerDictado(t){

      const s=ch.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); if(!s) return;
      let cant=0, u='', resto=s; const m=s.match(new RegExp('(\\d+(?:[.,]\\d+)?)\\s*'+RU+'?(?![a-z])'));
      if(m){ cant=parse(m[1]); u=claseU(m[2]); resto=s.replace(m[0],' '); }
      else { const w=s.match(new RegExp('(?:^|\\s)(un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|quince|veinte|medio|media)\\s+'+RU+'(?![a-z])'));
        if(w){ cant=NUMW[w[1]]; u=claseU(w[2]); resto=s.replace(w[0],' '); } }
      const p=buscarProd(norm(resto.replace(/\b(de|del|la|el|los|las)\b/g,' ')));
      if(!p||!(cant>0)){ no.push(ch.trim()); return; }
      if((u==='g'||u==='ml')&&p.unidad!=='ud') cant=cant/1000;

  function clasesIng(){

  /* ---- Eventos y menús cerrados ---- */
  function explotar(p,f,acc,d){
    const rac=p.raciones>0?p.raciones:1;
    p.ingredientes.forEach(i => { const b=bruto(i)*f/rac, u=un(i), c=u==='ud'?b:b/1000, pr=prod(i.productoId), bs=pr?null:baseDe(i);
      if(bs&&(d||0)<5){ explotar(bs,c,acc,(d||0)+1); return; } if(!nom(i)||(!pr&&!(i.precio>0))) return;
      const k=pr?pr.id:'x:'+norm(i.nombre), o=acc[k]||(acc[k]={n:nom(i),prov:pr?pr.proveedor:'',u:u,q:0,c:0}); o.q+=c; o.c+=c*pre(i); });
    return acc;
  }

      '<p class="hint">Primero la persona crea su cuenta en la app con su correo y contraseña. Después le das acceso aquí. Cocina apunta inventario, mermas, compras, APPCC y producción; Solo consulta no cambia nada.</p>'+
      (esPlat?'<form id="form-rest" class="mx-fil" novalidate><div class="field"><label for="us-rest">Nuevo restaurante</label><input id="us-rest" type="text" autocomplete="off" placeholder="Nombre"></div><button class="btn" type="submit">Crear restaurante</button></form>':'')+
      '<p class="hint" id="us-msg" role="status">'+esc(msg||'')+'</p>';
  }
  const usRpc = (fn,args,ok) => sb.rpc(fn,args).then(q => { if(q.error) throw q.error; return cargarMiembros().then(() => pintarUsuarios(ok)); }).catch(e => pintarUsuarios(errTxt(e)));
  $('btn-usuarios').addEventListener('click', abrirUsuarios);
  $('usuarios').addEventListener('click', e => { const b=e.target.closest('[data-us]'); if(!b||b.tagName==='SELECT') return;
    if(b.dataset.us==='cerrar') cerrarUsuarios(); else if(b.dataset.us==='quitar'&&confirmar(b,'¿Quitar?')) usRpc('quitar_miembro',{p_rid:rid,p_user:b.dataset.id},'Acceso retirado.'); });
  $('usuarios').addEventListener('change', e => { const t=e.target; if(t.dataset.us==='rol') usRpc('cambiar_rol',{p_rid:rid,p_user:t.dataset.id,p_rol:t.value},'Rol actualizado.'); });
  $('usuarios').addEventListener('submit', e => { e.preventDefault(); const f=e.target, m=$('us-msg');
    if(f.id==='form-us'){ const em=$('us-email').value.trim(); if(!/^\S+@\S+\.\S+$/.test(em)){ m.textContent='Escribe el correo de la persona.'; return; } m.textContent='Guardando…'; usRpc('agregar_miembro',{p_rid:rid,p_email:em,p_rol:$('us-rol').value},'Acceso dado a '+em+'.'); }
    else if(f.id==='form-rest'){ const n=$('us-rest').value.trim(); if(!n){ m.textContent='Escribe el nombre del restaurante.'; return; } m.textContent='Creando…';
      sb.rpc('crear_restaurante',{p_nombre:n}).then(q => { if(q.error) throw q.error; mem('bbc.rest',q.data); location.reload(); }).catch(er => { m.textContent=errTxt(er); }); } });
  document.addEventListener('keydown', e => { if(e.key==='Escape'&&!$('usuarios').hidden) cerrarUsuarios(); });
  /* IA propia: la app llama a la función "ia" del servidor, que es quien habla con Gemini */
  function iaNube(){
    const b64 = bl => new Promise((ok,ko) => { const fr=new FileReader(); fr.onload=() => ok({data:String(fr.result).split(',')[1]||'',mime:bl.type||'image/jpeg'}); fr.onerror=() => ko(new Error('img')); fr.readAsDataURL(bl); });
    const E = (code,msg) => { const e=new Error(msg||code); e.code=code; if(msg) e.msgIA=msg; return e; };
    async function llamar(cuerpo,signal){
      let tok=''; try{ const q=await sb.auth.getSession(); tok=(q.data&&q.data.session&&q.data.session.access_token)||''; }catch(e){}
      if(!tok) throw E('session_expired','Tu sesión ha caducado. Sal y vuelve a entrar.');
      let r; try{ r=await fetch(CFG.url+'/functions/v1/ia',{method:'POST',signal:signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok,apikey:CFG.key},body:JSON.stringify(Object.assign({rid:rid},cuerpo))}); }
      catch(e){ if(e&&e.name==='AbortError') throw E('cancelled'); throw E('red','Sin conexión con la IA. Revisa internet y vuelve a intentarlo.'); }
      if(!r.ok){ let m=''; try{ m=(await r.json()).error||''; }catch(e){} if(r.status===404) m='La IA todavía no está activada en el servidor.'; throw E(r.status===429?'rate_limited':'unavailable',m||'La IA no está disponible ahora mismo.'); }
      return r; }
    const plano = input => typeof input==='string' ? input : input.map(m => (m.role==='user'?'USUARIO':'ASISTENTE')+':\n'+m.content).join('\n\n')+(input.length>1?'\n\nResponde ahora al último mensaje del USUARIO, teniendo en cuenta la conversación.':'');
    const f = async (input,opts) => { opts=opts||{}; const r=await llamar({modo:'chat',texto:plano(input)},opts.signal); let text='';
      try{ const rd=r.body.getReader(), dec=new TextDecoder(); for(;;){ const x=await rd.read(); if(x.done) break; text+=dec.decode(x.value,{stream:true}); if(opts.onText) opts.onText({text:text}); } }
      catch(e){ const er=E(e&&e.name==='AbortError'?'cancelled':'red',e&&e.name==='AbortError'?'':'Se cortó la conexión con la IA.'); er.text=text; throw er; }
      return {text:text,truncated:false}; };
    f.json = async (prompt,opts) => { opts=opts||{}; const imgs=await Promise.all((opts.images||[]).map(b64));
      const r=await llamar({modo:'json',texto:prompt,imagenes:imgs},opts.signal), j=await r.json().catch(() => null); let t=String((j&&j.text)||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
      const a=t.indexOf('{'), z=t.lastIndexOf('}'); try{ return JSON.parse(a>=0&&z>a?t.slice(a,z+1):t); }catch(e){ throw E('invalid_json'); } };
    f.limits = () => Promise.resolve({images:{mediaTypes:['image/jpeg','image/png','image/webp'],maxCount:4}});
    return f;
  }
  function nube(){
    try{ sb=window.supabase.createClient(CFG.url,CFG.key); }catch(e){ local(); return; }
    if(CFG.entorno==='pruebas') $('entorno').hidden=false;
    acceso('cargando'); sb.auth.onAuthStateChange((ev,s) => { setTimeout(() => cambioSesion(s,ev),0); });
  }
  function local(){
    try{ const d=JSON.parse(mem('esc2.datos')||'null'); if(d){ COLS.forEach(c => { S[c]=(d[c]||[]).map(NORM[c]); }); if(d.ajustes) S.ajustes={id:'empresa',nombre:String(d.ajustes.nombre||''),periodo:PER[d.ajustes.periodo]?d.ajustes.periodo:'mensual'}; } }catch(e){} sucio(); COLS.forEach(sombrear);
    esLocal=true; $('btn-restaurar').hidden=false; $('m-copia').hidden=false; aviso('Los datos se guardan solo en este dispositivo. Haz copias desde el menú.'); const np=mem('bbc.nivelPrueba'); if(np==='view'||np==='interact') setNivel(np); else $('rol').textContent=NIVTXT.admin; ruta();
  }
  function remoto(d){
    db=d; const t=setTimeout(() => aviso('Todavía no se pueden cargar los datos guardados. Seguimos intentándolo.'),10000); let falta=COLS.length;
    const hecho=() => { if(falta>0&&--falta===0){ clearTimeout(t); if(!soloLectura) aviso(''); } };
    COLS.forEach(col => { let primero=true;
      db.collection(col).limit(1000).onSnapshot(snap => {
        if(primero&&!snap.metadata.fromCache){ primero=false; hecho(); }
        recibir(col, snap.docs.map(x => { const o=JSON.parse(JSON.stringify(x.data()||{})); o.id=x.id; return o; }));
      }, () => { clearTimeout(t); cargado[col]=true; aviso('No se pudo conectar con los datos guardados. Recarga la página más tarde.'); pintar(); });
    });
    db.doc('ajustes/empresa').onSnapshot(s => {
      if(!s.exists||busy('ajustes','empresa')) return; const x=s.data()||{};
      S.ajustes={id:'empresa',nombre:String(x.nombre||''),periodo:PER[x.periodo]?x.periodo:'mensual'};
    }, () => {});
    ruta();
  }
  const CU=(window.claude&&typeof window.claude.use==='function') ? n => Promise.resolve(window.claude.use(n)).catch(() => null) : () => Promise.resolve(null);
  CU('sample').then(sm => { if(!sm) return; sAPI=sm; refrescar(); sm.limits().then(l => { sLim=l; refrescar(); }, () => {}); });
  CU('db').then(d => {
    if(!d){ if(CFG&&CFG.url&&window.supabase) nube(); else local(); return; }
    remoto(d);
    CU('user').then(u => { if(!u) return; uAPI=u; u.id().then(i => { miId=i; }, () => {});
      Promise.all([u.canEdit(),u.can('data.write')]).then(r => setNivel(r[0]?'admin':r[1]===false?'view':'interact'), () => {}); });
  }, () => { if(CFG&&CFG.url&&window.supabase) nube(); else local(); });
})();
</script>
